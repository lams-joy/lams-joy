<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10091c"/><stop offset=".55" stop-color="#21103a"/><stop offset="1" stop-color="#090613"/></linearGradient>
  <linearGradient id="pink" x1="0" x2="1"><stop stop-color="#f472b6"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="360" rx="24" fill="url(#bg)"/>
<g fill="#fff" opacity=".7">
 <circle cx="75" cy="55" r="1.5"/><circle cx="160" cy="125" r="1"/><circle cx="278" cy="48" r="1.4"/><circle cx="392" cy="104" r="1"/><circle cx="525" cy="38" r="1.5"/><circle cx="660" cy="126" r="1"/><circle cx="815" cy="60" r="1.4"/><circle cx="950" cy="116" r="1"/><circle cx="1090" cy="45" r="1.5"/><circle cx="1140" cy="170" r="1"/>
</g>
<g font-family="monospace">
 <text x="70" y="70" fill="#f9a8d4" font-size="16" font-weight="700" letter-spacing="5">PLAYER 01 / JOY LAMKA</text>
 <text x="70" y="128" fill="white" font-size="40" font-weight="800">BUILDING, LEARNING,</text>
 <text x="70" y="176" fill="url(#pink)" font-size="40" font-weight="800">BECOMING.</text>
 <text x="70" y="214" fill="#c4b5fd" font-size="14">software  /  cloud  /  embedded  /  curiosity</text>
 <text x="930" y="66" fill="#f9a8d4" font-size="12" text-anchor="end">HIGH SCORE</text>
 <text x="930" y="92" fill="white" font-size="20" text-anchor="end">STILL RISING</text>
</g>
<!-- enemy formation -->
<g filter="url(#glow)" fill="url(#pink)">
 <path d="M930 145 l12 -10 12 10 12 -10 12 10 -6 22 h-36z"/>
 <path d="M1000 145 l12 -10 12 10 12 -10 12 10 -6 22 h-36z"/>
 <path d="M1070 145 l12 -10 12 10 12 -10 12 10 -6 22 h-36z"/>
</g>
<!-- player ship -->
<g transform="translate(1010 245)" filter="url(#glow)">
 <path d="M0 -36 L18 8 L8 4 L0 24 L-8 4 L-18 8 Z" fill="#f9a8d4"/>
 <path d="M0 -20 L7 -3 L0 5 L-7 -3 Z" fill="#fff"/>
 <path d="M-4 24 L0 39 L4 24" fill="#c084fc"/>
</g>
<!-- laser -->
<rect x="1010" y="282" width="2" height="34" fill="#fff" opacity=".9">
 <animate attributeName="y" values="282;230;282" dur="1.5s" repeatCount="indefinite"/>
</rect>
<!-- progress line -->
<rect x="70" y="282" width="700" height="3" rx="2" fill="#3b244e"/>
<rect x="70" y="282" width="520" height="3" rx="2" fill="url(#pink)"/>
<g font-family="monospace" font-size="11" fill="#a78bfa">
 <text x="70" y="315">UNIVERSITY</text><text x="245" y="315">INTERNSHIPS</text><text x="425" y="315">CLOUD</text><text x="545" y="315">ZONE01</text><text x="650" y="315">NOW</text>
</g>
</svg>
